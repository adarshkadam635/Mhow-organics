<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose a new password — The Smiling Worm</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-standalone">
    <div id="toast-root" aria-live="polite"></div>
    <main>
      <section class="auth-screen">
        <div class="container">
          <div class="auth-card">
            <aside class="auth-visual">
              <div class="auth-visual-art">
                <img src="assets/logo.png" alt="The Smiling Worm by Mhow Organics" />
              </div>
              <div class="auth-visual-slides">
                <article class="auth-slide active">
                  <h2>Let's get you back in</h2>
                  <p>
                    Choose a new password and your cart, wishlist and saved
                    addresses will be waiting exactly where you left them.
                  </p>
                </article>
              </div>
            </aside>
            <div class="auth-panel">
              <a class="auth-back link-btn" href="index.html#account">← Back to sign in</a>
              <img class="auth-logo" src="assets/logo.png" alt="The Smiling Worm by Mhow Organics" />
              <h1>Choose a new password</h1>
              <p class="auth-sub" id="resetIntro">Checking your reset link...</p>

              <form id="resetForm" class="auth-form" novalidate hidden>
                <label class="auth-field">
                  <span>New password</span>
                  <input
                    name="password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    required
                  />
                </label>
                <label class="auth-field">
                  <span>Confirm new password</span>
                  <input
                    name="confirmPassword"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Repeat your new password"
                    required
                  />
                </label>
                <button class="btn auth-submit" type="submit">Save new password</button>
              </form>

              <p class="auth-status" id="resetStatus" role="status"></p>

              <p class="auth-switch" id="resetRetry" hidden>
                <a class="link-btn" href="index.html#account">Request a new reset link</a>
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabase-config.js?v=1"></script>
    <script>
      const settings = window.SUPABASE_CONFIG || {};
      const intro = document.getElementById("resetIntro");
      const status = document.getElementById("resetStatus");
      const form = document.getElementById("resetForm");
      const retry = document.getElementById("resetRetry");

      function toast(message) {
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = message;
        document.getElementById("toast-root").appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }
      function fail(message) {
        intro.textContent = message;
        form.hidden = true;
        retry.hidden = false;
      }

      const configured =
        String(settings.url || "").startsWith("http") &&
        !String(settings.url).includes("YOUR_") &&
        String(settings.anonKey || "").length > 20 &&
        !String(settings.anonKey).includes("YOUR_") &&
        Boolean(window.supabase?.createClient);

      const isLocalDev = ["localhost", "127.0.0.1", ""].includes(location.hostname);
      if (!configured) {
        fail(
          isLocalDev
            ? "Developer note: Supabase is not connected yet. Add your project URL and anon key to store/supabase-config.js to enable password resets."
            : "Password reset is not available right now. Please email mhoworganics@gmail.com and we will help you back in.",
        );
      } else {
        const client = window.supabase.createClient(settings.url, settings.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });

        // Supabase sends errors back on the URL fragment when a link has
        // already been used or has expired.
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
        const queryParams = new URLSearchParams(location.search);
        const linkError =
          hashParams.get("error_description") || queryParams.get("error_description");

        async function activate() {
          if (linkError) {
            fail(`${linkError}. Reset links can only be used once and expire after 1 hour.`);
            return;
          }
          // supabase-js consumes the recovery token from the URL on load;
          // give it a moment, then confirm a session actually exists.
          const code = queryParams.get("code");
          if (code) {
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) {
              fail(`${error.message}. Please request a new reset link.`);
              return;
            }
          }
          const { data } = await client.auth.getSession();
          if (!data?.session) {
            fail(
              "This password reset link is invalid or has expired. Please request a new one.",
            );
            return;
          }
          const email = data.session.user?.email || "your account";
          intro.textContent = `Setting a new password for ${email}.`;
          form.hidden = false;
          history.replaceState(null, "", location.pathname);
        }

        client.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") activate();
        });
        activate();

        form.onsubmit = async (event) => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(form));
          if (String(data.password || "").length < 8) {
            toast("Password must be at least 8 characters");
            return;
          }
          if (data.password !== data.confirmPassword) {
            toast("Passwords do not match");
            return;
          }
          const button = form.querySelector("button[type=submit]");
          button.disabled = true;
          status.textContent = "Saving your new password...";
          const { error } = await client.auth.updateUser({ password: data.password });
          if (error) {
            status.textContent = "";
            toast(error.message);
            button.disabled = false;
            return;
          }
          form.hidden = true;
          intro.textContent = "";
          status.textContent =
            "Your password has been updated. Taking you back to sign in...";
          await client.auth.signOut().catch(() => {});
          setTimeout(() => {
            location.href = "index.html#account";
          }, 1800);
        };
      }
    </script>
  </body>
</html>
